
spring.application.name=fe_be

# MySQL Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=${PORT:8080}

# Frontend CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173,${FRONTEND_URL:http://localhost:5173}

# Application logging
logging.level.root=INFO
logging.level.com.coder.fe_be=INFO

# Display date and time in logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

server.forward-headers-strategy=framework
